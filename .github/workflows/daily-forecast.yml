name: Daily Forecast Update

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      skip_timeline:
        description: 'Skip timeline update (for manual reruns)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh and validate inputs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/fetch_inputs.py

      - name: Verify schemas and model behavior
        run: python -m pytest -q

      - name: Generate and validate forecast bundle
        run: python scripts/generate_forecast.py ${{ inputs.skip_timeline && '--skip-timeline' || '' }}

      - name: Verify published artifact contract
        run: python -m pytest -q tests/test_forecast.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Daily forecast update $(date -u +%Y-%m-%d)"
          git push
